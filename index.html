<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador Avançado de Linha de Produção 4.0</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #141419;
            color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            margin: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { margin-bottom: 5px; color: #4dabf7; font-size: 22px; text-align: center; }
        .sub { color: #a0a0b0; margin-top: 0; margin-bottom: 15px; font-size: 12px; text-align: center; }
        
        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 1200px;
        }

        .painel-lateral {
            background: #1e1e24;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
        }
        .painel-lateral > div { flex: 1; min-width: 140px; }
        .painel-lateral h2 { font-size: 13px; margin: 0 0 8px 0; border-bottom: 1px solid #3b3b4f; padding-bottom: 3px; color: #22b8cf; text-transform: uppercase; }
        
        .painel-principal { display: flex; flex-direction: column; gap: 15px; width: 100%; }

        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .kpi-card {
            background: #1e1e24;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border-bottom: 4px solid #4dabf7;
        }
        .kpi-card h3 { margin: 0 0 5px 0; font-size: 11px; text-transform: uppercase; color: #a0a0b0; }
        .kpi-card p { margin: 0; font-size: 20px; font-weight: bold; }

        .canvas-container { width: 100%; overflow: hidden; position: relative; }
        canvas {
            background: #1e1e24;
            border: 2px solid #2b2b36;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            height: auto;
            display: block;
        }

        .controle-grupo { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
        .controle-row { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
        label { font-size: 10px; text-transform: uppercase; color: #a0a0b0; font-weight: 600; }
        
        input[type="number"] {
            background: #2b2b36;
            border: 1px solid #3b3b4f;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            width: 55px;
            text-align: center;
            font-size: 14px;
        }
        input[type="range"] { width: 100%; height: 15px; cursor: pointer; }
        
        button {
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background: #22b8cf;
            color: white;
            border: none;
            border-radius: 5px;
            width: 100%;
            margin-bottom: 5px;
            touch-action: manipulation;
        }
        button:hover { background: #11999e; }
        .btn-auto { background: #2b8a3e; }
        .btn-auto.ativo { background: #e63946; }
        
        .btn-manutencao {
            padding: 6px 10px;
            font-size: 11px;
            background: #ff922b;
            width: auto;
            border-radius: 4px;
            margin: 0;
        }

        @media (min-width: 768px) {
            body { padding: 20px; }
            h1 { font-size: 28px; }
            .grid-container { display: grid; grid-template-columns: 280px 1fr; }
            .painel-lateral { flex-direction: column; }
            .dashboard { grid-template-columns: repeat(4, 1fr); }
            .kpi-card p { font-size: 24px; }
        }
    </style>
</head>
<body>

    <h1>Simulador de Linha de Produção Industrial 4.0</h1>
    <div class="sub">Sistema Universal Adaptável com Alimentador Automático</div>

    <div class="grid-container">
        
        <!-- CONTROLES DA FÁBRICA -->
        <div class="painel-lateral">
            <div>
                <h2>Alimentação</h2>
                <button onclick="adicionarProduto()">Injetar Manual</button>
                <button id="btnAuto" class="btn-auto" onclick="alternarAuto()">Auto Feed: DESL</button>
            </div>

            <div>
                <h2>Logística</h2>
                <div class="controle-grupo">
                    <label>Velocidade (<span id="txtVel">2</span> px/f)</label>
                    <input type="range" id="sliderVelocidade" min="1" max="5" value="2" oninput="atualizarParametros()">
                </div>
            </div>

            <div>
                <h2>Ciclos (segundos)</h2>
                <div class="controle-grupo controle-row">
                    <label>1. Prensa:</label>
                    <input type="number" id="tempo_0" value="1.5" step="0.1" min="0.5" onchange="atualizarParametros()">
                </div>
                <div class="controle-grupo controle-row">
                    <label>2. Pintura:</label>
                    <input type="number" id="tempo_1" value="2.0" step="0.1" min="0.5" onchange="atualizarParametros()">
                </div>
                <div class="controle-grupo controle-row">
                    <label>3. Triagem:</label>
                    <input type="number" id="tempo_2" value="1.0" step="0.1" min="0.5" onchange="atualizarParametros()">
                </div>
            </div>

            <div>
                <h2>Manutenção</h2>
                <div class="controle-grupo" style="gap: 8px;">
                    <div class="controle-row">
                        <label>Prensa:</label>
                        <button class="btn-manutencao" id="btnMan_0" onclick="consertarMaquina(0)" style="display:none;">Consertar</button>
                        <span id="statusMan_0" style="color:#2b8a3e; font-size:11px; font-weight:bold;">OK</span>
                    </div>
                    <div class="controle-row">
                        <label>Pintura:</label>
                        <button class="btn-manutencao" id="btnMan_1" onclick="consertarMaquina(1)" style="display:none;">Consertar</button>
                        <span id="statusMan_1" style="color:#2b8a3e; font-size:11px; font-weight:bold;">OK</span>
                    </div>
                    <div class="controle-row">
                        <label>Triagem:</label>
                        <button class="btn-manutencao" id="btnMan_2" onclick="consertarMaquina(2)" style="display:none;">Consertar</button>
                        <span id="statusMan_2" style="color:#2b8a3e; font-size:11px; font-weight:bold;">OK</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- EXIBIÇÃO DA LINHA E GRÁFICO -->
        <div class="painel-principal">
            <div class="dashboard">
                <div class="kpi-card" style="border-bottom-color: #74c0fc;"><h3>Processo (WIP)</h3><p id="kpiWip">0</p></div>
                <div class="kpi-card" style="border-bottom-color: #2b8a3e;"><h3>Produzido</h3><p id="kpiConcluidos">0</p></div>
                <div class="kpi-card" style="border-bottom-color: #f5a623;"><h3>OEE (Disp.)</h3><p id="kpiEficiencia">100%</p></div>
                <div class="kpi-card" style="border-bottom-color: #e63946;"><h3>Falhas</h3><p id="kpiFalhas">0</p></div>
            </div>
            <div class="canvas-container"><canvas id="canvasSimulador" width="900" height="180"></canvas></div>
            <div class="canvas-container"><canvas id="canvasGrafico" width="900" height="150"></canvas></div>
        </div>
    </div>

    <!-- ⚙️ LÓGICA DO MOTOR DA FÁBRICA VIRTUAL COMPLETA -->
    <script>
        const canvasSim = document.getElementById("canvasSimulador");
        const ctxSim = canvasSim.getContext("2d");
        const canvasGrafico = document.getElementById("canvasGrafico");
        const ctxGrafico = canvasGrafico.getContext("2d");

        // Configurações do Sistema
        let velocidade = 2;
        let autoFeed = false;
        let autoFeedTimer = null;

        // Histórico para o Gráfico de Desempenho
        let historicoWIP = new Array(60).fill(0);

        // KPIs da Fábrica
        let produtosConcluidos = 0;
        let totalFalhas = 0;

        // Estrutura das Máquinas (Prensa, Pintura, Triagem)
        let maquinas = [
            { id: 0, nome: "Prensa", x: 250, y: 90, tempoCiclo: 90, tempoRestante: 0, quebrada: false, produtoAtual: null, cor: "#ff7675" },
            { id: 1, nome: "Pintura", x: 500, y: 90, tempoCiclo: 120, tempoRestante: 0, quebrada: false, produtoAtual: null, cor: "#ffeaa7" },
            { id: 2, nome: "Triagem", x: 750, y: 90, tempoCiclo: 60, tempoRestante: 0, quebrada: false, produtoAtual: null, cor: "#55efc4" }
        ];

        // Lista de produtos na esteira (WIP)
        let produtos = [];

        function atualizarParametros() {
            velocidade = parseInt(document.getElementById("sliderVelocidade").value);
            document.getElementById("txtVel").innerText = velocidade;

            // Transforma os segundos inseridos pelo usuário em frames de animação (~60fps)
            maquinas[0].tempoCiclo = Math.max(30, parseFloat(document.getElementById("tempo_0").value) * 60);
            maquinas[1].tempoCiclo = Math.max(30, parseFloat(document.getElementById("tempo_1").value) * 60);
            maquinas[2].tempoCiclo = Math.max(30, parseFloat(document.getElementById("tempo_2").value) * 60);
        }

        function adicionarProduto() {
            // Só adiciona se o início da esteira não estiver engargalado
            if (produtos.length === 0 || produtos[0].x > 40) {
                produtos.unshift({
                    x: 10,
                    y: 90,
                    estagio: 0, // 0 = Movendo, 1 = Processando
                    maquinaAlvo: 0,
                    cor: "#4dabf7" // Matéria-prima azul
                });
            }
        }

        function alternarAuto() {
            autoFeed = !autoFeed;
            const btn = document.getElementById("btnAuto");
            if (autoFeed) {
                btn.innerText = "Auto Feed: LIG";
                btn.classList.add("ativo");
                autoFeedTimer = setInterval(adicionarProduto, 2500); // Injeta um produto a cada 2.5s
            } else {
                btn.innerText = "Auto Feed: DESL";
                btn.classList.remove("ativo");
                clearInterval(autoFeedTimer);
            }
        }

        function consertarMaquina(id) {
            maquinas[id].quebrada = false;
            document.getElementById(`btnMan_${id}`).style.display = "none";
            const status = document.getElementById(`statusMan_${id}`);
            status.innerText = "OK";
            status.style.color = "#2b8a3e";
        }

        function simularFalhaAleatoria(id) {
            // Chance matemática pequena por frame para simular quebra estocástica por estresse
            if (Math.random() < 0.0015 && !maquinas[id].quebrada && maquinas[id].produtoAtual) {
                maquinas[id].quebrada = true;
                totalFalhas++;
                document.getElementById(`btnMan_${id}`).style.display = "inline-block";
                const status = document.getElementById(`statusMan_${id}`);
                status.innerText = "FALHA";
                status.style.color = "#e63946";
            }
        }

        function logicaFabrica() {
            // 1. Processamento das Máquinas
            maquinas.forEach(m => {
                if (m.quebrada) return; // Máquina travada por manutenção

                if (m.produtoAtual) {
                    simularFalhaAleatoria(m.id);
                    if (m.quebrada) return; // Se quebrou agora, interrompe

                    m.tempoRestante--;
                    if (m.tempoRestante <= 0) {
                        // Finalizou o ciclo! Libera o produto de volta para a esteira
                        let p = m.produtoAtual;
                        p.estagio = 0; 
                        p.x = m.x + 25; // Coloca logo após a saída da máquina
                        p.maquinaAlvo++;
                        
                        // Mudança visual de estado do produto
                        if (m.id === 0) p.cor = "#a29bfe"; // Estampado (Roxo)
                        if (m.id === 1) p.cor = "#00cec9"; // Pintado (Ciano)

                        produtos.push(p);
                        m.produtoAtual = null;
                    }
                }
            });

            // 2. Movimentação dos Produtos na Esteira
            for (let i = produtos.length - 1; i >= 0; i--) {
                let p = produtos[i];

                if (p.estagio === 0) {
                    let alvo = maquinas[p.maquinaAlvo];

                    if (alvo) {
                        // Se aproximando de uma máquina
                        if (p.x < alvo.x - 20) {
                            // Verifica se há outro produto parado logo à frente para evitar sobreposição (Fila)
                            let barreira = false;
                            for (let j = 0; j < produtos.length; j++) {
                                if (produtos[j] !== p && produtos[j].x > p.x && produtos[j].x - p.x < 25) {
                                    barreira = true;
                                }
                            }
                            if (!barreira) p.x += velocidade;
                        } else {
                            // Chegou na máquina! Verifica se ela está vazia e funcionando
                            if (!alvo.produtoAtual && !alvo.quebrada) {
                                alvo.produtoAtual = p;
                                alvo.tempoRestante = alvo.tempoCiclo;
                                p.estagio = 1;
                                produtos.splice(i, 1); // Remove da esteira ativa temporariamente
                            }
                        }
                    } else {
                        // Passou da última máquina (Triagem), vai para a expedição
                        if (p.x < canvasSim.width - 30) {
                            p.x += velocidade;
                        } else {
                            produtosConcluidos++;
                            produtos.splice(i, 1); // Produto finalizado com sucesso
                        }
                    }
                }
            }
        }

        function desenharSimulador() {
            ctxSim.clearRect(0, 0, canvasSim.width, canvasSim.height);

            // Desenha a linha física da esteira rolante
            ctxSim.fillStyle = "#3b3b4f";
            ctxSim.fillRect(10, 85, canvasSim.width - 20, 15);

            // Desenha as Torres das Máquinas
            maquinas.forEach(m => {
                ctxSim.fillStyle = m.quebrada ? "#e63946" : (m.produtoAtual ? "#f5a623" : "#2b8a3e");
                ctxSim.fillRect(m.x - 30, m.y - 45, 60, 40);
                
                // Texto do nome da máquina
                ctxSim.fillStyle = "#fff";
                ctxSim.font = "bold 11px sans-serif";
                ctxSim.fillText(m.nome, m.x - 20, m.y - 25);

                // Barra de progresso do processamento
                if (m.produtoAtual && !m.quebrada) {
                    let pct = (m.tempoCiclo - m.tempoRestante) / m.tempoCiclo;
                    ctxSim.fillStyle = "#4dabf7";
                    ctxSim.fillRect(m.x - 25, m.y - 12, 50 * pct, 4);
                }
            });

            // Desenha os Produtos na esteira
            produtos.forEach(p => {
                ctxSim.fillStyle = p.cor;
                ctxSim.fillRect(p.x - 10, p.y - 10, 20, 20);
                ctxSim.strokeStyle = "#fff";
                ctxSim.strokeRect(p.x - 10, p.y - 10, 20, 20);
            });

            // Desenha os Produtos atualmente dentro das máquinas
            maquinas.forEach(m => {
                if (m.produtoAtual) {
                    ctxSim.fillStyle = m.produtoAtual.cor;
                    ctxSim.fillRect(m.x - 10, m.y - 5, 20, 20);
                }
            });
        }

        function desenharGrafico() {
            ctxGrafico.clearRect(0, 0, canvasGrafico.width, canvasGrafico.height);
            
            ctxGrafico.strokeStyle = "#2b2b36";
            ctxGrafico.lineWidth = 1;
            for(let i=1; i<5; i++) {
                let y = canvasGrafico.height - (i * 30);
                ctxGrafico.beginPath();
                ctxGrafico.moveTo(0, y);
                ctxGrafico.lineTo(canvasGrafico.width, y);
                ctxGrafico.stroke();
            }

            // Desenha a linha histórica do WIP
            ctxGrafico.strokeStyle = "#4dabf7";
            ctxGrafico.lineWidth = 3;
            ctxGrafico.beginPath();
            
            let espacamento = canvasGrafico.width / (historicoWIP.length - 1);
            for (let i = 0; i < historicoWIP.length; i++) {
                let x = i * espacamento;
                let y = canvasGrafico.height - (historicoWIP[i] * 12) - 10;
                if (i === 0) ctxGrafico.moveTo(x, y);
                else ctxGrafico.lineTo(x, y);
            }
            ctxGrafico.stroke();

            ctxGrafico.fillStyle = "#a0a0b0";
            ctxGrafico.font = "10px sans-serif";
            ctxGrafico.fillText("Histórico de Carga de Trabalho (WIP ao longo do tempo)", 15, 20);
        }

        function atualizarKPIs() {
            let produtosEmProcesso = produtos.length;
